# =============================================================================
# CreatorFlow — Spring Boot Application Configuration
# auth-service (same pattern applies to media-service, scheduler-service)
#
# Credentials are NEVER hardcoded here.
# All sensitive values are injected via environment variables.
#
# Local dev:  values come from your .env file (loaded by docker-compose or IDE)
# Production: values come from AWS Secrets Manager / ECS task definition env vars
# =============================================================================

spring:
  application:
    name: auth-service

  # ---------------------------------------------------------------------------
  # DataSource — PostgreSQL 16
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000       # 30 seconds
      idle-timeout: 600000            # 10 minutes
      max-lifetime: 1800000           # 30 minutes
      pool-name: CreatorFlowHikariPool

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway manages schema — never use create/update here
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ---------------------------------------------------------------------------
  # Spring Security — default in-memory user (dev only)
  # Replace with Keycloak in Phase 1 (Week 3)
  # ---------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/creatorflow

  # ---------------------------------------------------------------------------
  # Flyway — DB migrations
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8081}           # defaults to 8081 if SERVER_PORT not set
  servlet:
    context-path: /creator-flow/auth

# ---------------------------------------------------------------------------
# Actuator — health checks
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized