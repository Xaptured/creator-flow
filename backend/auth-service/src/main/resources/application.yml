spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CreatorFlowHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/creatorflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/creatorflow/protocol/openid-connect/certs}

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

  profiles:
    active: ${APP_ENV:local}

  # Java 21 virtual threads for the Tomcat request executor. Override without
  # touching this file via env var SPRING_THREADS_VIRTUAL_ENABLED=false.
  threads:
    virtual:
      enabled: true

  lifecycle:
    # Upper bound on graceful shutdown; must stay below the ECS
    # stopTimeout (default 30s) or the task gets SIGKILLed mid-drain.
    timeout-per-shutdown-phase: 20s

server:
  # Default lets `docker run` boot with only DB/Redis/Keycloak env supplied.
  # ECS task definitions still set AUTH_SERVER_PORT explicitly.
  port: ${AUTH_SERVER_PORT:8080}
  servlet:
    context-path: /creator-flow/auth
  # Finish in-flight requests on SIGTERM instead of dropping them when ECS
  # replaces a task (rolling deploy or Spot capacity reclaim).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Exposes /actuator/health/readiness and /actuator/health/liveness
      # outside Kubernetes (auto-enabled only on k8s otherwise).
      probes:
        enabled: true
  health:
    # Readiness deliberately left as readinessState only — pulling db/redis
    # into the group would deregister every task from the ALB simultaneously
    # during a brief DB blip. Liveness stays livenessState only so a
    # dependency outage never triggers a restart storm.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60