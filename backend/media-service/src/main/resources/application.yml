spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CreatorFlowHikariPool
      keepalive-time: 300000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/creatorflow

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms
  profiles:
    active: ${APP_ENV}

server:
  port: ${MEDIA_SERVER_PORT}
  servlet:
    context-path: /creator-flow/media

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60
  aws:
    region: ${AWS_REGION}
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE}
    bucket-name: ${AWS_S3_BUCKET}
    upload-url-expiry-minutes: 15
    read-url-expiry-hours: 1
    max-file-size-bytes: 524288000
    queues:
      post-dispatcher: ${AWS_SQS_QUEUE_POST_DISPATCHER}
    topics:
      content-published: ${AWS_SNS_TOPIC_CONTENT_PUBLISHED}
      media-events: ${AWS_SNS_TOPIC_MEDIA_EVENTS}
  sqs:
    poll-delay-ms: ${SQS_POLL_DELAY_MS}
  frontend-base-url: ${FRONTEND_BASE_URL}
  google:
    oauth:
      client-id: ${GOOGLE_YOUTUBE_CLIENT_ID}
      client-secret: ${GOOGLE_YOUTUBE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_YOUTUBE_REDIRECT_URI}
      scopes: ${GOOGLE_YOUTUBE_SCOPES}
  meta:
    oauth:
      client-id: ${INSTAGRAM_CLIENT_ID}
      client-secret: ${INSTAGRAM_CLIENT_SECRET}
      redirect-uri: ${INSTAGRAM_REDIRECT_URI}
      sandbox: true
      scopes: ${INSTAGRAM_SCOPES}
  twitter:
    oauth:
      client-id: ${TWITTER_CLIENT_ID}
      client-secret: ${TWITTER_CLIENT_SECRET}
      redirect-uri: ${TWITTER_REDIRECT_URI}
      scopes: ${TWITTER_SCOPES}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  token-refresh:
    refresh-ahead-hours: ${TOKEN_REFRESH_AHEAD_HOURS:12}
  ig-container:
    poll-interval-seconds: ${IG_CONTAINER_POLL_INTERVAL_SECONDS}
    timeout-minutes: ${IG_CONTAINER_TIMEOUT_MINUTES}
