spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CreatorFlowHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/creatorflow

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  profiles:
    active: ${APP_ENV}


  quartz:
    job-store-type: memory
    auto-startup: true
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5

  scheduling:
    enabled: true

server:
  port: ${ANALYTICS_SERVER_PORT}
  servlet:
    context-path: /creator-flow/analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60
  aws:
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE}
    region: ${AWS_REGION}
    queues:
      analytics: ${AWS_SQS_QUEUE_ANALYTICS}
    topics:
      analytics-events: ${AWS_SNS_TOPIC_ANALYTICS_EVENTS}
  sqs:
    poll-delay-ms: ${SQS_POLL_DELAY_MS}