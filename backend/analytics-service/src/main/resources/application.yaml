spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CreatorFlowHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/creatorflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/creatorflow/protocol/openid-connect/certs}

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  profiles:
    active: ${APP_ENV:local}

  lifecycle:
    # Below the ECS stopTimeout (default 30s) so the task is never SIGKILLed
    # mid-drain. Gives the in-flight SQS message time to be acked or returned —
    # otherwise it waits out the queue visibility timeout before redelivery.
    timeout-per-shutdown-phase: 20s

  # In-memory job store: no persistence, no cluster lock. Run exactly ONE
  # task/replica or every metric-fetch job runs twice.
  quartz:
    job-store-type: memory
    auto-startup: true
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5

  scheduling:
    enabled: true

server:
  port: ${ANALYTICS_SERVER_PORT:8080}
  servlet:
    context-path: /creator-flow/analytics
  # Finish in-flight requests on SIGTERM instead of dropping them when ECS
  # replaces a task (rolling deploy or Spot capacity reclaim).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Exposes /actuator/health/readiness and /liveness outside Kubernetes.
      probes:
        enabled: true
  health:
    # readiness = readinessState only. Including db/redis would deregister
    # every task from the ALB at once during a brief dependency blip.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

app:
  media-service:
    base-url: ${MEDIA_SERVICE_BASE_URL}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  # TEST-ONLY: when accelerated=true, metric-fetch windows ignore the real hour
  # schedule and fire after the minute offsets below (window 0 at 5m, 1 at 10m,
  # 2 at 15m by default). Keep accelerated=false in production.
  metrics:
    # Default flipped to false: this ships in an image, and a missed env var
    # must not silently run accelerated metric windows in production.
    # Local dev opts in via METRICS_ACCELERATED=true.
    accelerated: ${METRICS_ACCELERATED:false}
    accelerated-offset-minutes: ${METRICS_ACCELERATED_OFFSETS:10,15,20}
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60
  aws:
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE}
    region: ${AWS_REGION}
    queues:
      analytics: ${AWS_SQS_QUEUE_ANALYTICS}
    topics:
      analytics-events: ${AWS_SNS_TOPIC_ANALYTICS_EVENTS}
  sqs:
    poll-delay-ms: ${SQS_POLL_DELAY_MS}
  youtube:
    analytics-api-base-url: ${GOOGLE_YOUTUBE_ANALYTICS_API_BASE_URL}
    data-api-base-url: ${GOOGLE_YOUTUBE_DATA_API_BASE_URL:https://www.googleapis.com/youtube/v3}
  instagram:
    graph-api-base-url: ${INSTAGRAM_GRAPH_API_BASE_URL}
  twitter:
    api-base-url: ${TWITTER_API_BASE_URL}