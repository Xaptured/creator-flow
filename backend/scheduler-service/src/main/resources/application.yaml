spring:
  application:
    name: scheduler-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CreatorFlowHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/creatorflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/creatorflow/protocol/openid-connect/certs}

  flyway:
    enabled: false

  profiles:
    active: ${APP_ENV:local}

  quartz:
    job-store-type: memory

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SCHEDULER_SERVER_PORT:8080}
  servlet:
    context-path: /creator-flow/scheduler
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60
  aws:
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE}
    region: ${AWS_REGION}
    topics:
      creatorflow-events: ${AWS_SNS_TOPIC_CREATORFLOW_EVENTS}
  scheduler:
    publish-job-interval-seconds: ${PUBLISH_JOB_INTERVAL_SECONDS}
    token-refresh-job-interval-seconds: ${TOKEN_REFRESH_JOB_INTERVAL_SECONDS:3600}
  sqs:
    poll-delay-ms: ${SQS_POLL_DELAY_MS}
  media-service:
    base-url: ${MEDIA_SERVICE_BASE_URL}
    refresh-expiring-path: ${MEDIA_REFRESH_EXPIRING_PATH:/creator-flow/media/internal/platforms/refresh-expiring}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
