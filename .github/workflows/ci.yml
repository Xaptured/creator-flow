name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Spring Boot services ──────────────────────────────────────────
  build-auth-service:
    name: Build auth-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -f backend/auth-service/pom.xml clean verify -DskipTests

  build-media-service:
    name: Build media-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -f backend/media-service/pom.xml clean verify -DskipTests

  build-scheduler-service:
    name: Build scheduler-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if pom.xml exists
        id: check
        run: |
          if [ -f "backend/scheduler-service/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: mvn -f backend/scheduler-service/pom.xml clean verify -DskipTests
      - name: Skip
        if: steps.check.outputs.exists == 'false'
        run: echo "scheduler-service not scaffolded yet — skipping"

  build-analytics-service:
    name: Build analytics-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if pom.xml exists
        id: check
        run: |
          if [ -f "backend/analytics-service/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: mvn -f backend/analytics-service/pom.xml clean verify -DskipTests
      - name: Skip
        if: steps.check.outputs.exists == 'false'
        run: echo "analytics-service not scaffolded yet — skipping"

  # ── Next.js frontend ─────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  # ── NestJS AI service ─────────────────────────────────────────────
  build-ai-service:
    name: Build ai-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-service/package-lock.json
      - name: Install
        run: npm ci --prefix ai-service
      - name: Build
        run: npm run build --prefix ai-service
      - name: Test
        run: npm test --prefix ai-service